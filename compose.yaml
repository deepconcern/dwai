# Runs the whole stack locally from the Dockerfiles: Postgres, the API, and
# the web app at http://localhost:3000. Start it with `docker compose up --build`.
# For production, point DATABASE_URI at a real database instead.

name: dwai

services:
  dwai-api:
    build:
      context: dwai-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ORIGINS: http://localhost:3000
      DATABASE_URI: postgres://dwai:dwai@postgres:5432/dwai
      LOG_LEVEL: info
    ports:
      - "5000:5000"

  dwai-app:
    build:
      context: dwai-app
    depends_on:
      - dwai-api
    ports:
      - "3000:3000"

  postgres:
    environment:
      POSTGRES_DB: dwai
      POSTGRES_PASSWORD: dwai
      POSTGRES_USER: dwai
    healthcheck:
      interval: 2s
      retries: 30
      test: ["CMD", "pg_isready", "-U", "dwai", "-d", "dwai"]
      timeout: 5s
    image: postgres:18
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
