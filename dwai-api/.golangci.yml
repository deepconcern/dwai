version: "2"

# Lint the integration tests and the e2e server too (they are behind build tags).
run:
  build-tags:
    - e2e
    - integration

# Default linters (errcheck, govet, ineffassign, staticcheck, unused). Files
# with a "Code generated ... DO NOT EDIT." header (gqlgen, sqlc) are skipped.
linters:
  default: standard

formatters:
  enable:
    - gofmt
    - goimports
